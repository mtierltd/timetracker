# Builds the frontend (js/) on every PR, so a broken build is noticed before
# merging and not only in the release workflow.
name: Frontend

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # same version as the release workflow
          node-version: '24'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        working-directory: js
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: js
        run: npm run build
